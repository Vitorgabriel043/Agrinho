<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Telemetria Agrícola</title>

  <!-- RESET -->
  <link rel="stylesheet" href="reset.css">

  <!-- STYLE -->
  <link rel="stylesheet" href="style.css">

  <!-- CHART -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

  <header class="header">

    <div class="logo">
      <span>🚜</span>
      <h1>Telemetria Agrícola</h1>
    </div>

    <div class="date" id="date"></div>

  </header>

  <main class="dashboard">

    <section class="card">
      <h2>Velocidade</h2>
      <div class="value" id="speed">0 km/h</div>
      <p>Status operacional</p>
    </section>

    <section class="card">
      <h2>Combustível</h2>
      <div class="value" id="fuel">0%</div>
      <p>Monitoramento ativo</p>
    </section>

    <section class="card">
      <h2>Temperatura</h2>
      <div class="value" id="temp">0°C</div>
      <p>Motor supervisionado</p>
    </section>

    <section class="card">
      <h2>Área Trabalhada</h2>
      <div class="value" id="area">0 ha</div>
      <p>Produção em andamento</p>
    </section>

  </main>

  <section class="chart-container">
    <h2>📈 Histórico de Velocidade</h2>

    <canvas id="chart"></canvas>
  </section>

  <footer class="footer">
    Sistema Inteligente de Máquinas Agrícolas
  </footer>

  <script src="main.js"></script>

</body>
</html>
